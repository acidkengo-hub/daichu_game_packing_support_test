<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /*
   * 梱包作業記録ビューア — 画面
   * 原本: リポジトリ game-packing-support の gas-viewer/Index.html
   *
   * 事務所のPCでクレーム対応のときに開く前提。
   * 「誰が・いつ・何に・何秒」を、目を横に動かさずに読めることを最優先にする。
   *
   * 見た目の基準は DESIGN.md（ウェルスナビ）。ただし業務画面なので、
   * 本文を15pxに下げて密度を上げ、数字は桁揃え（tabular-nums）にしている。
   */
  :root {
    --navy: #004d94;      /* 主の操作（探す・開く） */
    --blue: #0984e3;      /* 従の操作（リンク・切り替え）とフォーカス */
    --text: #333333;
    --text-sub: #666666;
    --text-muted: #888888;
    --danger: #ee0f3e;    /* 取り消し（梱包のやり直し）の印 */
    --ground: #f0f3f5;    /* 地 */
    --surface: #ffffff;   /* 面 */
    --tint: #e2f2fd;      /* 見出し行・選択中 */
    --line: #e3e8ec;      /* 表の区切り */
    --input-line: #cccccc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ground);
    color: var(--text);
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    letter-spacing: normal;
  }
  button, input, select { font: inherit; color: inherit; letter-spacing: normal; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- ボタン ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 24px;
    border: 0;
    border-radius: 100px;
    background: var(--navy);
    color: #fff;
    font-weight: 700;
    line-height: 1.4;
    cursor: pointer;
  }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.wide { width: 100%; }
  .text-btn {
    min-height: 44px;
    padding: 0 4px;
    border: 0;
    background: none;
    color: var(--blue);
    font-weight: 500;
    cursor: pointer;
  }

  /* ---------- 入力 ---------- */
  .field { margin-bottom: 16px; }
  .field > label, .field > .label {
    display: block;
    margin-bottom: 4px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--text-sub);
  }
  input[type="text"], input[type="password"], input[type="date"], select {
    width: 100%;
    min-width: 0;
    min-height: 44px;
    padding: 8px 14px;
    border: 1px solid var(--input-line);
    border-radius: 8px;
    background: #fff;
  }
  input:focus-visible, select:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 0;
    border-color: var(--blue);
  }
  .error {
    margin: 12px 0 0;
    color: var(--danger);
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-line;
  }

  /* ---------- ログイン ---------- */
  .login { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  .login form {
    width: min(380px, 100%);
    padding: 32px;
    background: var(--surface);
    border-radius: 24px;
  }
  .login h1 { margin: 0 0 4px; font-size: 22px; line-height: 1.4; color: var(--navy); }
  .login p.lead { margin: 0 0 24px; color: var(--text-sub); }

  /* ---------- 全体の枠 ---------- */
  .app { min-height: 100%; display: grid; grid-template-rows: auto 1fr; }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 24px;
    min-height: 60px;
    background: var(--surface);
  }
  header h1 { margin: 0; font-size: 17px; line-height: 1.4; color: var(--navy); }
  header .spacer { flex: 1; }

  .layout {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    gap: 24px;
    padding: 24px;
    align-items: start;
  }
  .layout.collapsed { grid-template-columns: minmax(0, 1fr); }
  .layout.collapsed .conditions { display: none; }

  /* ---------- 検索条件 ---------- */
  .conditions {
    position: sticky;
    top: 24px;
    padding: 24px;
    background: var(--surface);
    border-radius: 24px;
  }
  .period { display: grid; gap: 8px; }
  .period .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
  .period .row span { font-size: 13px; color: var(--text-sub); }
  .hint { margin: -8px 0 20px; font-size: 12px; line-height: 1.6; color: var(--text-muted); }

  /* ---------- 結果 ---------- */
  .result-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 16px;
    margin-bottom: 12px;
  }
  .result-head .count { font-size: 18px; font-weight: 700; line-height: 1.4; }
  .result-head .query { color: var(--text-sub); font-size: 14px; }
  .notice {
    margin: 0 0 12px;
    padding: 10px 16px;
    border-radius: 8px;
    background: var(--tint);
    font-size: 14px;
  }
  .empty {
    padding: 48px 24px;
    border-radius: 24px;
    background: var(--surface);
    color: var(--text-sub);
    text-align: center;
  }

  /* 条件を変えた後の、古い結果 */
  .results.stale .sheet { opacity: .4; }

  .sheet {
    background: var(--surface);
    border-radius: 24px;
    padding: 8px 0;
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th {
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--text-sub);
    text-align: left;
    white-space: nowrap;
    border-bottom: 1px solid var(--line);
  }
  td {
    padding: 12px 16px;
    vertical-align: top;
    border-bottom: 1px solid var(--line);
  }
  tbody tr:last-child td { border-bottom: 0; }

  /* 左の3列＝誰が・いつ・何秒。狭く詰めて、目の移動を減らす */
  td.worker { white-space: nowrap; font-weight: 700; font-size: 16px; line-height: 1.4; }
  td.when { white-space: nowrap; }
  td.when .time { font-weight: 500; }
  td.duration, th.duration { text-align: right; white-space: nowrap; }
  td.duration { font-weight: 700; font-size: 17px; line-height: 1.4; }
  .sub { display: block; font-size: 12px; line-height: 1.6; color: var(--text-muted); }

  td.products ul { margin: 0; padding: 0; list-style: none; }
  td.products li + li { margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--line); }
  td.products .code { margin-left: 8px; font-size: 12px; color: var(--text-muted); }

  td.order { white-space: nowrap; }
  td.order .no { font-weight: 500; }
  td.order .none { color: var(--text-muted); }

  /* 20分以上の梱包。梱包以外の作業が混ざった可能性があり、ヒアリングの手がかりにする */
  td.duration.long { color: var(--danger); }
  .long-chip {
    min-height: 32px;
    padding: 0 14px;
    border: 1px solid var(--danger);
    border-radius: 100px;
    background: #fff;
    color: var(--danger);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .long-chip[aria-pressed="true"] { background: var(--danger); color: #fff; }

  tr.cancelled td { color: var(--text-muted); }
  tr.cancelled td.duration { text-decoration: line-through; }
  .tag {
    display: inline-block;
    margin-top: 4px;
    padding: 0 10px;
    border-radius: 100px;
    background: var(--danger);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.8;
  }

  /* ---------- 画面の切り替え（検索／集計） ---------- */
  .tabs { display: flex; gap: 4px; }
  .tab {
    min-height: 44px;
    padding: 0 16px;
    border: 0;
    border-bottom: 3px solid transparent;
    background: none;
    color: var(--text-sub);
    font-weight: 500;
    cursor: pointer;
  }
  .tab[aria-selected="true"] { color: var(--navy); font-weight: 700; border-bottom-color: var(--navy); }

  /* ---------- 集計 ---------- */
  .summary-view { padding: 24px; max-width: 1100px; }
  .summary-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 20px; }
  .summary-bar label { font-weight: 500; color: var(--text-sub); font-size: 14px; }
  .summary-bar select { width: auto; min-width: 160px; }
  .summary-bar .query { color: var(--text-sub); font-size: 14px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .tile { padding: 20px 24px; border-radius: 24px; background: var(--surface); }
  .tile h2 { margin: 0 0 8px; font-size: 16px; line-height: 1.4; }
  .tile .label { display: block; font-size: 13px; color: var(--text-sub); }
  .tile .median {
    display: block;
    margin: 2px 0 6px;
    font-size: 32px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--navy);
    font-variant-numeric: tabular-nums;
  }
  .tile .meta { font-size: 14px; color: var(--text-sub); font-variant-numeric: tabular-nums; }
  .ratio { margin: 12px 0 0; font-size: 14px; color: var(--text-sub); }
  .long-text { color: var(--danger); font-weight: 700; }

  .segment {
    display: inline-flex;
    gap: 4px;
    margin: 28px 0 12px;
    padding: 4px;
    border-radius: 100px;
    background: var(--surface);
  }
  .segment button {
    min-height: 40px;
    padding: 0 20px;
    border: 0;
    border-radius: 100px;
    background: none;
    color: var(--text-sub);
    font-weight: 500;
    cursor: pointer;
  }
  .segment button[aria-pressed="true"] { background: var(--navy); color: #fff; font-weight: 700; }

  .workers td.num, .workers th.num { text-align: right; white-space: nowrap; }
  .workers td.num { font-weight: 700; }
  .workers tbody tr { cursor: pointer; }
  .workers tbody tr:hover td { background: #f7fafc; }
  .workers tbody tr.selected td { background: var(--tint); }
  .worker-btn {
    padding: 0;
    text-align: left;
    border: 0;
    background: none;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
  }

  .chart-card { margin-top: 16px; padding: 20px 24px 16px; border-radius: 24px; background: var(--surface); }
  .chart-card h3 { margin: 0 0 4px; font-size: 16px; line-height: 1.4; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 8px; font-size: 13px; color: var(--text-sub); }
  .legend .swatch { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; border-radius: 2px; }
  .chart-card svg { display: block; width: 100%; height: auto; }
  .caution { margin: 16px 0 0; font-size: 13px; line-height: 1.6; color: var(--text-muted); }

  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); padding: 16px; }
    .conditions { position: static; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- ログイン -->
<section class="login" id="loginView" hidden>
  <form id="loginForm">
    <h1>梱包作業記録</h1>
    <p class="lead">パスワードを入れてください</p>
    <div class="field">
      <label for="password">パスワード</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button class="btn wide" type="submit" id="loginButton">開く</button>
    <p class="error" id="loginError" role="alert"></p>
  </form>
</section>

<!-- 本体 -->
<div class="app" id="appView" hidden>
  <header>
    <h1>梱包作業記録</h1>
    <nav class="tabs" role="tablist" aria-label="画面の切り替え">
      <button class="tab" type="button" role="tab" id="tabSearch" aria-selected="true">検索</button>
      <button class="tab" type="button" role="tab" id="tabSummary" aria-selected="false">集計</button>
    </nav>
    <button class="text-btn" type="button" id="toggleButton" aria-controls="searchForm" aria-expanded="true">条件を隠す</button>
    <span class="spacer"></span>
    <button class="text-btn" type="button" id="logoutButton">ログアウト</button>
  </header>

  <div class="layout" id="layout">
    <form class="conditions" id="searchForm">
      <div class="field">
        <label for="qShopOrder">注文番号</label>
        <input type="text" id="qShopOrder" placeholder="一部だけでも探せます">
      </div>
      <div class="field">
        <label for="qMgmt">管理番号</label>
        <input type="text" id="qMgmt">
      </div>
      <div class="field">
        <label for="qProduct">商品名</label>
        <input type="text" id="qProduct" placeholder="例：PS2">
      </div>
      <div class="field">
        <label for="qWorker">担当者</label>
        <select id="qWorker"><option value="">すべて</option></select>
      </div>
      <div class="field">
        <span class="label">期間</span>
        <div class="period">
          <div class="row">
            <input type="date" id="qFrom" aria-label="期間の始まり">
            <span>から</span>
          </div>
          <div class="row">
            <input type="date" id="qTo" aria-label="期間の終わり">
            <span>まで</span>
          </div>
        </div>
      </div>
      <p class="hint">期間を空けると、先月の1日から今日までを探します</p>
      <button class="btn wide" type="submit" id="searchButton">探す</button>
      <p class="error" id="searchError" role="alert"></p>
    </form>

    <main class="results" id="results" aria-live="polite">
      <div class="empty">注文番号や担当者を入れて「探す」を押してください</div>
    </main>
  </div>

  <!-- 集計 -->
  <section class="summary-view" id="summaryView" hidden>
    <div class="summary-bar">
      <label for="period">期間</label>
      <select id="period">
        <option value="thisMonth">今月</option>
        <option value="lastMonth">先月</option>
        <option value="last3">過去3か月</option>
      </select>
      <span class="query" id="summaryRange"></span>
    </div>
    <p class="error" id="summaryError" role="alert"></p>
    <div id="summaryBody" aria-live="polite"></div>
  </section>
</div>

<script>
  // ログインの合言葉はこのタブの中だけに置く（タブを閉じれば消える）。
  // 有効期限はサーバー側で6時間。切れたらパスワードの画面に戻す。
  var TOKEN_KEY = "packing-viewer-token";

  function getToken() {
    try { return sessionStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
  }
  function setToken(t) {
    try { t ? sessionStorage.setItem(TOKEN_KEY, t) : sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }

  /**
   * google.script.run を Promise で包む。
   *
   * 呼べるのは「最後にデプロイした版」の Code.gs にある関数だけ。
   * Index.html だけ新しくして Code.gs を貼り忘れる（または貼る前にデプロイする）と、
   * 関数が見つからない。そのときは原因が分かる文面で知らせる（2026-10-04 に発生）。
   */
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      if (typeof runner[fn] !== "function") {
        reject(new Error(
          "サーバー側に「" + fn + "」がありません\n" +
            "　→ Apps Script の コード.gs を最新にして保存し、新しいバージョンでデプロイしてください"
        ));
        return;
      }
      runner[fn].apply(runner, args);
    });
  }

  function isAuthError(err) {
    return ((err && err.message) || "").indexOf("ログイン") >= 0;
  }

  var $ = function (id) { return document.getElementById(id); };

  function showLogin(message) {
    setToken("");
    $("appView").hidden = true;
    $("loginView").hidden = false;
    $("loginError").textContent = message || "";
    $("password").value = "";
    $("password").focus();
  }

  function showApp() {
    $("loginView").hidden = true;
    $("appView").hidden = false;
    $("qShopOrder").focus();
  }

  // ---------- ログイン ----------

  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var button = $("loginButton");
    button.disabled = true;
    $("loginError").textContent = "";

    call("login", $("password").value)
      .then(function (token) {
        setToken(token);
        return loadWorkers().then(showApp);
      })
      .catch(function (err) {
        $("loginError").textContent = err.message;
        $("password").select();
      })
      .then(function () { button.disabled = false; });
  });

  $("logoutButton").addEventListener("click", function () { showLogin(""); });

  function loadWorkers() {
    return call("listWorkers", getToken()).then(function (workers) {
      var select = $("qWorker");
      select.length = 1; // 「すべて」だけ残す
      workers.forEach(function (name) {
        var opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
    });
  }

  // ---------- 検索条件の欄を開け閉めする ----------
  // 閉じている間も、表の上に「どの条件で探したか」を出し続ける。

  $("toggleButton").addEventListener("click", function () {
    var layout = $("layout");
    var collapsed = layout.classList.toggle("collapsed");
    this.textContent = collapsed ? "条件を表示" : "条件を隠す";
    this.setAttribute("aria-expanded", String(!collapsed));
    if (!collapsed) $("qShopOrder").focus();
  });

  // ---------- 検索 ----------

  var hasResult = false;

  /**
   * 「長い梱包」とみなす所要時間（秒）。
   * 20分を超えるのは、梱包以外の対応をはさんだ場合と見られる（現場の感覚、2026-10-04）。
   * V4 の平均・推移の集計で外す線にも同じ値を使う予定。
   */
  var LONG_SEC = 20 * 60;

  // 直近の検索結果。20分以上だけに絞るとき、表だけを作り直すのに使う
  var lastGroups = [];
  var onlyLong = false;

  function readQuery() {
    return {
      shopOrderNo: $("qShopOrder").value.trim(),
      mgmtNo: $("qMgmt").value.trim(),
      product: $("qProduct").value.trim(),
      worker: $("qWorker").value,
      from: $("qFrom").value,
      to: $("qTo").value,
    };
  }

  // 結果を出した後に条件を変えたら、今の結果は古いと分かるようにする。
  // 画面の条件と結果が食い違って見え、別の人の記録を取り違えるのを防ぐ（2026-10-04）。
  function markStale() {
    if (!hasResult) return;
    var main = $("results");
    if (main.classList.contains("stale")) return;
    main.classList.add("stale");
    var note = el("div", "notice", "条件が変わりました。「探す」を押すと更新されます");
    note.id = "staleNotice";
    main.insertBefore(note, main.firstChild);
  }
  ["input", "change"].forEach(function (type) {
    $("searchForm").addEventListener(type, markStale);
  });

  $("searchForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var button = $("searchButton");
    button.disabled = true;
    button.textContent = "探しています…";
    $("searchError").textContent = "";

    var query = readQuery();

    call("searchSlips", getToken(), query)
      .then(function (result) { render(result, query); })
      .catch(function (err) {
        if (isAuthError(err)) { showLogin(err.message); return; }
        $("searchError").textContent = err.message;
      })
      .then(function () {
        button.disabled = false;
        button.textContent = "探す";
      });
  });

  /**
   * 検索結果を伝票ごとにまとめ、表にする。
   * 同梱の伝票は商品ごとに行が分かれて記録されているので、受信IDでまとめる。
   *
   * ⚠️ サーバーは新しい行から順に返す。同梱の伝票では2行目以降が先に来るため、
   * 所要時間（1行目にだけ記録されている）は、どの行に入っていても拾う。
   * 商品は先頭に足していき、元の並びに戻す（2026-10-04 に、同梱の所要時間が
   * 「—」になる不具合として発見）。
   */
  function render(result, query) {
    var main = $("results");
    main.textContent = "";
    main.classList.remove("stale");
    hasResult = true;
    onlyLong = false;

    var groups = [];
    var index = {};
    result.rows.forEach(function (r) {
      var key = r.receiveId || (r.mgmtNo + r.doneAt);
      if (!(key in index)) {
        index[key] = groups.length;
        groups.push({ head: r, items: [], durationSec: null });
      }
      var g = groups[index[key]];
      g.items.unshift(r);
      if (r.durationSec != null) g.durationSec = r.durationSec;
    });
    lastGroups = groups;

    // 表の上に「何の結果か」を出す。条件欄を閉じていても分かるように。
    var head = el("div", "result-head");
    head.appendChild(el("span", "count", groups.length + "件の伝票"));

    var longCount = groups.filter(isLong).length;
    if (longCount > 0) {
      var chip = el("button", "long-chip", "20分以上 " + longCount + "件");
      chip.type = "button";
      chip.setAttribute("aria-pressed", "false");
      chip.title = "押すと20分以上の伝票だけを表示します";
      chip.addEventListener("click", function () {
        onlyLong = !onlyLong;
        chip.setAttribute("aria-pressed", String(onlyLong));
        fillRows();
      });
      head.appendChild(chip);
    }

    head.appendChild(el("span", "query", describeQuery(query, result.months)));
    main.appendChild(head);

    if (result.truncated) {
      main.appendChild(el("div", "notice",
        "該当が多いため、新しい順に" + result.rows.length + "行までを表示しています。条件を絞ってください"));
    }

    if (groups.length === 0) {
      main.appendChild(el("div", "empty",
        "該当する記録はありません。注文番号は一部だけでも探せます。期間も確かめてください"));
      return;
    }

    var sheet = el("div", "sheet");
    var table = el("table");
    var thead = el("thead");
    var tr = el("tr");
    [["担当", ""], ["完了", ""], ["所要", "duration"], ["商品", ""], ["注文番号", ""]]
      .forEach(function (c) { tr.appendChild(el("th", c[1], c[0])); });
    thead.appendChild(tr);
    table.appendChild(thead);

    var tbody = el("tbody");
    tbody.id = "slipRows";
    table.appendChild(tbody);
    sheet.appendChild(table);
    main.appendChild(sheet);

    fillRows();
  }

  /** 20分以上の伝票か。取り消しになった伝票は、やり直す前の時間なので数えない */
  function isLong(g) {
    return !g.head.cancelled && g.durationSec != null && g.durationSec >= LONG_SEC;
  }

  /** 表の行を作り直す。20分以上だけに絞るときもここを通る */
  function fillRows() {
    var tbody = $("slipRows");
    if (!tbody) return;
    tbody.textContent = "";
    lastGroups
      .filter(function (g) { return !onlyLong || isLong(g); })
      .forEach(function (g) { tbody.appendChild(slipRow(g)); });
  }

  function slipRow(g) {
    var h = g.head;
    var tr = el("tr", h.cancelled ? "cancelled" : "");

    // 担当
    var worker = el("td", "worker", h.worker);
    if (h.cancelled) {
      worker.appendChild(document.createElement("br"));
      worker.appendChild(el("span", "tag", "取り消し"));
    }
    tr.appendChild(worker);

    // 完了（日時と便）
    var when = el("td", "when");
    when.appendChild(el("span", "time", shortDate(h.date) + " " + (h.doneAt || "").substring(0, 5)));
    when.appendChild(el("span", "sub", h.bin + " " + h.carrier));
    tr.appendChild(when);

    // 所要。同梱の伝票は、まとめたときに拾った値を使う
    tr.appendChild(el("td", "duration" + (isLong(g) ? " long" : ""),
      g.durationSec != null ? formatDuration(g.durationSec) : "—"));

    // 商品（同梱は1行ずつ）
    var products = el("td", "products");
    var list = el("ul");
    g.items.forEach(function (it) {
      var li = el("li");
      li.appendChild(document.createTextNode(it.product));
      if (it.code) li.appendChild(el("span", "code", it.code));
      list.appendChild(li);
    });
    products.appendChild(list);
    tr.appendChild(products);

    // 注文番号と管理番号
    var order = el("td", "order");
    order.appendChild(h.shopOrderNo ? el("span", "no", h.shopOrderNo) : el("span", "none", "記録なし"));
    order.appendChild(el("span", "sub", "管理 " + h.mgmtNo));
    tr.appendChild(order);

    return tr;
  }

  /** 探した条件を一文にする。条件欄を閉じていても、何の結果か分かるように */
  function describeQuery(q, months) {
    var parts = [];
    if (q.shopOrderNo) parts.push("注文番号「" + q.shopOrderNo + "」");
    if (q.mgmtNo) parts.push("管理番号「" + q.mgmtNo + "」");
    if (q.product) parts.push("商品名「" + q.product + "」");
    if (q.worker) parts.push("担当者：" + q.worker);
    if (q.from || q.to) {
      parts.push("期間：" + (q.from ? shortDate(q.from) : "") + "〜" + (q.to ? shortDate(q.to) : "今日"));
    } else if (months && months.length) {
      parts.push("期間：" + months[0].substring(5) + "/01〜今日");
    }
    return parts.join("　");
  }

  /** 2026-10-04 → 10/04 */
  function shortDate(d) {
    return d && d.length >= 10 ? d.substring(5, 7) + "/" + d.substring(8, 10) : d || "";
  }

  /**
   * 秒 → 「2分05秒」。
   * 「2:05」の形は、隣の完了時刻（13:56）と見分けがつかないため使わない。
   * 秒は2桁にそろえ、右揃えで縦に比べやすくする。
   */
  function formatDuration(sec) {
    var total = Math.round(sec);
    var m = Math.floor(total / 60);
    var s = total % 60;
    if (m === 0) return s + "秒";
    return m + "分" + (s < 10 ? "0" + s : s) + "秒";
  }

  /** 要素を作る。文字は textContent で入れ、HTMLとして解釈させない */
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // ---------- 画面の切り替え（検索／集計） ----------

  function switchTab(name) {
    var isSummary = name === "summary";
    $("tabSearch").setAttribute("aria-selected", String(!isSummary));
    $("tabSummary").setAttribute("aria-selected", String(isSummary));
    $("layout").hidden = isSummary;
    $("summaryView").hidden = !isSummary;
    // 「条件を隠す」は検索画面だけのもの
    $("toggleButton").hidden = isSummary;
    if (isSummary && !summaryData) loadSummary();
  }
  $("tabSearch").addEventListener("click", function () { switchTab("search"); });
  $("tabSummary").addEventListener("click", function () { switchTab("summary"); });

  // ---------- 集計 ----------
  // 配送方法ごとに集計する。ネコポスはソフト中心で短く、宅急便は本体セット中心で長い。
  // 混ぜると、ネコポスを多く担当した人ほど速く見え、比較が成り立たない（2026-10-04 に実データで確認）。

  var summaryData = null;
  var summaryCarrier = null;
  var summaryWorker = null;

  $("period").addEventListener("change", loadSummary);

  function loadSummary() {
    var body = $("summaryBody");
    $("summaryError").textContent = "";
    body.textContent = "";
    body.appendChild(el("div", "empty", "集計しています…"));

    call("summarize", getToken(), $("period").value)
      .then(renderSummary)
      .catch(function (err) {
        if (isAuthError(err)) { showLogin(err.message); return; }
        body.textContent = "";
        $("summaryError").textContent = err.message;
      });
  }

  function renderSummary(data) {
    summaryData = data;
    var body = $("summaryBody");
    body.textContent = "";
    $("summaryRange").textContent = shortDate(data.from) + "〜" + shortDate(data.to);

    if (!data.carriers.length) {
      body.appendChild(el("div", "empty", "この期間の記録はありません。期間を変えてください"));
      return;
    }

    // 配送方法ごとの全体の値を並べる
    var tiles = el("div", "tiles");
    data.carriers.forEach(function (c) {
      var tile = el("div", "tile");
      tile.appendChild(el("h2", "", c.carrier));
      tile.appendChild(el("span", "label", "1件あたり（中央値）"));
      tile.appendChild(el("span", "median", c.medianSec != null ? formatDuration(c.medianSec) : "—"));
      var meta = el("div", "meta", c.count + "件　");
      meta.appendChild(c.longCount > 0
        ? el("span", "long-text", "20分以上 " + c.longCount + "件")
        : document.createTextNode("20分以上 0件"));
      tile.appendChild(meta);
      tiles.appendChild(tile);
    });
    body.appendChild(tiles);

    var t = findCarrier("宅急便"), n = findCarrier("ネコポス");
    if (t && n && t.medianSec && n.medianSec) {
      body.appendChild(el("p", "ratio",
        "宅急便の1件あたりは、ネコポスの約" + (t.medianSec / n.medianSec).toFixed(1) + "倍です"));
    }

    // 担当者の表は配送方法ごとに切り替える。「すべて」は作らない（混ぜた比較は誤解のもとになるため）
    if (!findCarrier(summaryCarrier)) summaryCarrier = data.carriers[0].carrier;
    var seg = el("div", "segment");
    seg.setAttribute("role", "group");
    seg.setAttribute("aria-label", "配送方法");
    data.carriers.forEach(function (c) {
      var b = el("button", "", c.carrier);
      b.type = "button";
      b.setAttribute("aria-pressed", String(c.carrier === summaryCarrier));
      b.addEventListener("click", function () {
        summaryCarrier = c.carrier;
        summaryWorker = null;
        renderSummary(summaryData);
      });
      seg.appendChild(b);
    });
    body.appendChild(seg);

    body.appendChild(workerTable(findCarrier(summaryCarrier)));

    var c = findCarrier(summaryCarrier);
    var w = c.workers.filter(function (x) { return x.name === summaryWorker; })[0] || c.workers[0];
    if (w) {
      summaryWorker = w.name;
      body.appendChild(trendCard(w, c.carrier));
    }

    body.appendChild(el("p", "caution",
      "1件あたりの時間は、何を梱包したかで変わります。人どうしの差には、担当した伝票の中身の違いも含まれます。" +
      "中央値は20分以上の伝票を除いて計算しています（20分以上は件数だけ数えています）。"));
  }

  function findCarrier(name) {
    if (!summaryData) return null;
    return summaryData.carriers.filter(function (c) { return c.carrier === name; })[0] || null;
  }

  function workerTable(c) {
    var sheet = el("div", "sheet");
    var table = el("table", "workers");
    var thead = el("thead");
    var hr = el("tr");
    [["担当", ""], ["件数", "num"], ["1件あたり（中央値）", "num"], ["20分以上", "num"]]
      .forEach(function (h) { hr.appendChild(el("th", h[1], h[0])); });
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = el("tbody");
    c.workers.forEach(function (w) {
      var tr = el("tr", w.name === summaryWorker ? "selected" : "");
      var nameCell = el("td");
      var btn = el("button", "worker-btn", w.name);
      btn.type = "button";
      btn.setAttribute("aria-label", w.name + "さんの推移を見る");
      nameCell.appendChild(btn);
      tr.appendChild(nameCell);
      tr.appendChild(el("td", "num", w.count + "件"));
      tr.appendChild(el("td", "num", w.medianSec != null ? formatDuration(w.medianSec) : "—"));
      tr.appendChild(el("td", "num" + (w.longCount > 0 ? " long-text" : ""), w.longCount + "件"));
      tr.addEventListener("click", function () {
        summaryWorker = w.name;
        renderSummary(summaryData);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    sheet.appendChild(table);
    return sheet;
  }

  /**
   * 選んだ人の週ごとの推移。棒＝件数（右の目盛り）、折れ線＝1件あたりの中央値（左の目盛り）。
   * 外部のグラフ部品は使わず、SVG を直接組む（読み込みの失敗や仕様変更に左右されないように）。
   */
  function trendCard(w, carrier) {
    var card = el("div", "chart-card");
    card.appendChild(el("h3", "", w.name + "さんの推移（" + carrier + "・週ごと）"));

    var legend = el("div", "legend");
    var l1 = el("span"); var s1 = el("span", "swatch"); s1.style.background = "#9fd3f7";
    l1.appendChild(s1); l1.appendChild(document.createTextNode("件数（右の目盛り）"));
    var l2 = el("span"); var s2 = el("span", "swatch"); s2.style.background = "#004d94";
    l2.appendChild(s2); l2.appendChild(document.createTextNode("1件あたりの中央値（左の目盛り）"));
    legend.appendChild(l1); legend.appendChild(l2);
    card.appendChild(legend);

    card.appendChild(drawChart(w.weeks));
    if (w.weeks.length < 2) {
      card.appendChild(el("p", "caution", "まだ1週分の記録しかありません。週を重ねると変化が見えてきます。"));
    }
    return card;
  }

  function drawChart(weeks) {
    var NS = "http://www.w3.org/2000/svg";
    var W = 760, H = 260, L = 64, R = 52, T = 16, B = 40;
    var pw = W - L - R, ph = H - T - B;

    function node(tag, attrs, text) {
      var n = document.createElementNS(NS, tag);
      Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
      if (text !== undefined) n.textContent = text;
      return n;
    }

    var svg = node("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "週ごとの件数と1件あたりの中央値" });

    // 目盛りの上限を切りのよい値にする
    var maxCount = Math.max.apply(null, weeks.map(function (x) { return x.count; }).concat([1]));
    var countTop = niceTop(maxCount);
    var meds = weeks.map(function (x) { return x.medianSec; }).filter(function (v) { return v != null; });
    var maxMed = Math.max.apply(null, meds.concat([60]));
    var medTop = Math.ceil(maxMed / 60) * 60; // 分単位で切り上げ

    // 横線と左右の目盛り（4本）
    for (var i = 0; i <= 4; i++) {
      var y = T + ph - (ph * i) / 4;
      svg.appendChild(node("line", { x1: L, x2: L + pw, y1: y, y2: y, stroke: "#e3e8ec" }));
      svg.appendChild(node("text", { x: L - 8, y: y + 4, "text-anchor": "end", "font-size": 12, fill: "#888888" },
        formatAxisMinutes((medTop * i) / 4)));
      svg.appendChild(node("text", { x: L + pw + 8, y: y + 4, "text-anchor": "start", "font-size": 12, fill: "#888888" },
        Math.round((countTop * i) / 4) + "件"));
    }

    var band = pw / Math.max(weeks.length, 1);
    var barW = Math.min(band * 0.5, 48);
    var points = [];

    weeks.forEach(function (wk, idx) {
      var cx = L + band * idx + band / 2;
      var bh = (ph * wk.count) / countTop;
      svg.appendChild(node("rect", {
        x: cx - barW / 2, y: T + ph - bh, width: barW, height: bh, rx: 4, fill: "#9fd3f7",
      }));
      svg.appendChild(node("text", { x: cx, y: H - B + 20, "text-anchor": "middle", "font-size": 12, fill: "#666666" },
        Number(wk.week.substring(5, 7)) + "/" + Number(wk.week.substring(8, 10)) + "〜"));
      if (wk.medianSec != null) {
        points.push([cx, T + ph - (ph * wk.medianSec) / medTop, wk.medianSec]);
      }
    });

    if (points.length > 1) {
      svg.appendChild(node("polyline", {
        points: points.map(function (p) { return p[0] + "," + p[1]; }).join(" "),
        fill: "none", stroke: "#004d94", "stroke-width": 2.5,
      }));
    }
    points.forEach(function (p) {
      svg.appendChild(node("circle", { cx: p[0], cy: p[1], r: 5, fill: "#004d94" }));
      svg.appendChild(node("text", { x: p[0], y: p[1] - 10, "text-anchor": "middle", "font-size": 12, "font-weight": 700, fill: "#004d94" },
        formatDuration(p[2])));
    });

    return svg;
  }

  /** 件数の目盛りの上限（切りのよい値に切り上げ） */
  function niceTop(v) {
    var steps = [4, 8, 12, 20, 40, 60, 100, 200, 400, 1000];
    for (var i = 0; i < steps.length; i++) if (v <= steps[i]) return steps[i];
    return Math.ceil(v / 1000) * 1000;
  }

  /** 秒 → 目盛りの表記（0分、1分30秒、3分） */
  function formatAxisMinutes(sec) {
    var m = Math.floor(sec / 60), s = Math.round(sec % 60);
    if (s === 0) return m + "分";
    return m > 0 ? m + "分" + s + "秒" : s + "秒";
  }

  // ---------- 起動 ----------
  // 合言葉が残っていれば、それで作業者一覧を読んでみる。
  // 期限切れならパスワードの画面に戻す。
  if (getToken()) {
    loadWorkers().then(showApp).catch(function (err) {
      showLogin(isAuthError(err) ? err.message : "");
    });
  } else {
    showLogin("");
  }
</script>
</body>
</html>
